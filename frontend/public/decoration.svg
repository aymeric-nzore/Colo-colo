<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="decorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Floating circles -->
  <circle cx="40" cy="50" r="30" fill="url(#decorGrad)" opacity="0.4"/>
  <circle cx="160" cy="80" r="40" fill="url(#decorGrad)" opacity="0.3"/>
  <circle cx="100" cy="160" r="35" fill="url(#decorGrad)" opacity="0.35"/>
  
  <!-- Accent lines -->
  <line x1="20" y1="30" x2="60" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="140" y1="20" x2="180" y2="60" stroke="#06b6d4" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="50" y1="180" x2="150" y2="160" stroke="#10b981" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>
