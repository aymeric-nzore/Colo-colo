<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Laptop -->
  <g filter="url(#glow)">
    <!-- Screen -->
    <rect x="60" y="40" width="280" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Content in screen -->
    <rect x="75" y="55" width="250" height="130" rx="8" fill="#f0f9ff"/>
    
    <!-- Keyboard section -->
    <rect x="50" y="205" width="300" height="15" rx="8" fill="#1f2937"/>
    
    <!-- Base -->
    <rect x="150" y="220" width="100" height="8" fill="#1f2937"/>
  </g>
  
  <!-- Books stacking -->
  <g transform="translate(320, 80)">
    <rect x="-25" y="0" width="50" height="70" fill="#10b981" rx="4" transform="rotate(-10 0 35)" filter="url(#glow)"/>
    <rect x="-25" y="15" width="50" height="70" fill="#06b6d4" rx="4" transform="rotate(-5 0 50)" filter="url(#glow)"/>
    <rect x="-25" y="30" width="50" height="70" fill="#3b82f6" rx="4" filter="url(#glow)"/>
  </g>
  
  <!-- Checkmark -->
  <g transform="translate(340, 180)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="#10b981"/>
    <path d="M -8 0 L -2 8 L 10 -6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Stars -->
  <g fill="#f97316" opacity="0.6">
    <circle cx="50" cy="20" r="4"/>
    <circle cx="350" cy="30" r="3"/>
    <circle cx="80" cy="260" r="3"/>
    <circle cx="320" cy="250" r="4"/>
  </g>
</svg>
