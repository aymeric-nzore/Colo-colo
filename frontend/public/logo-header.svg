<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow circle -->
  <circle cx="40" cy="40" r="35" fill="url(#bookGradient)" opacity="0.12"/>
  
  <!-- Book main shape -->
  <g filter="url(#logoGlow)">
    <!-- Left page (orange) -->
    <path d="M 20 18 L 20 62 L 35 58 L 35 14 Z" fill="#f97316" opacity="0.95"/>
    
    <!-- Right page (darker orange) -->
    <path d="M 35 14 L 35 58 L 50 62 L 50 18 Z" fill="#ea580c" opacity="1"/>
    
    <!-- Book spine highlight -->
    <rect x="33" y="14" width="4" height="44" fill="#fbbf24" opacity="0.8"/>
    
    <!-- Top shine effect -->
    <ellipse cx="35" cy="16" rx="16" ry="4" fill="white" opacity="0.35"/>
  </g>
  
  <!-- Star/Excellence symbol (blue-cyan) -->
  <g transform="translate(62, 32)">
    <polygon points="0,-8 2.4,-2.4 8,-2.4 3.6,2 5.2,7.6 0,4 -5.2,7.6 -3.6,2 -8,-2.4 -2.4,-2.4" 
             fill="url(#accentGradient)" opacity="1" filter="url(#logoGlow)"/>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="72" cy="20" r="2.5" fill="#f97316" opacity="0.7"/>
  <circle cx="72" cy="60" r="2.5" fill="#06b6d4" opacity="0.7"/>
  
  <!-- Subtle border glow -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="url(#bookGradient)" stroke-width="1.5" opacity="0.4"/>
</svg>